function saveCl(){if(!F.name.trim())return toast('نام کلاس را وارد کن');F.price=+F.price||0;F.sessions.forEach(s=>{if(s.k&&s.k!==s.date+s.time)[1440,720,120,0].forEach(o=>delete S.fired[s.id+o]);delete s.k});if(F.id){S.cl[S.cl.findIndex(c=>c.id===F.id)]=F}else{F.id=uid();S.cl.push(F)}sv();H.pop();V={t:'clsD',id:F.id};render(1)}

function ph(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,120,120);F2.photo=c.toDataURL('image/jpeg',.7);render()};im.src=r.result};r.readAsDataURL(f)}
function saveSt(){if(!F2.name.trim())return toast('نام را وارد کن');if(F2.id){S.st[S.st.findIndex(s=>s.id===F2.id)]=F2}else{F2.id=uid();S.st.push(F2)}sv();H.pop();V={t:'stuD',id:F2.id};render(1)}

function addPay(){const a=+$('#pa').value;if(!(a>0))return toast('مبلغ را وارد کن');S.pay.push({id:uid(),sid:V.sid,amount:Math.round(a),date:gd('pd')||today(),method:window.PM,note:$('#pn').value});sv();toast('پرداخت ثبت شد');back()}

function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function csv(){dl('report.csv','\ufeff'+T.map(r=>r.map(x=>'"'+String(typeof x==='number'?x:x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function bk(){dl('backup-'+today()+'.json',JSON.stringify(S),'application/json')}
